name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        pytest -v
    
    - name: Build Docker image
      run: |
        docker build -t grok4trades:${{ github.sha }} .
        docker tag grok4trades:${{ github.sha }} grok4trades:latest
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push Docker image
      run: |
        docker tag grok4trades:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/grok4trades:${{ github.sha }}
        docker tag grok4trades:latest ${{ secrets.DOCKER_USERNAME }}/grok4trades:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/grok4trades:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/grok4trades:latest
    
    - name: Deploy to production
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "Deploying version ${{ github.ref_name }} to production"
        # Add your deployment commands here
        # For example: 
        # - SSH to production server
        # - Pull latest Docker image
        # - Restart services
        # - Run migrations if needed
