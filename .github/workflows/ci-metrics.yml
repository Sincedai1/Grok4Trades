name: CI Metrics Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          pip install prometheus-client uvicorn fastapi
          pip install opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-logging
      
      - name: Start API server
        run: |
          source .venv/bin/activate
          export DRY_RUN=1
          export ALERTS_ENABLED=0
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &> uvicorn.log &
          sleep 5
      
      - name: Check Prometheus metrics
        run: |
          # Wait for metrics server to start
          sleep 3
          
          # Fetch metrics
          curl -s http://localhost:9100/metrics | tee metrics.txt
          
          # Validate required metrics exist
          echo "Checking for required metrics..."
          grep -E 'g4t_requests_total|g4t_errors_total' metrics.txt || {
            echo "ERROR: Required metrics not found!"
            cat uvicorn.log
            exit 1
          }
          
          echo "✅ All required metrics found"
      
      - name: Test SSE endpoint
        run: |
          # Test SSE streaming endpoint
          curl -s -N --max-time 3 http://localhost:8000/stream/events | head -n 5 | tee sse_test.txt
          
          # Check for event stream format
          if grep -q "data:" sse_test.txt; then
            echo "✅ SSE endpoint working"
          else
            echo "ERROR: SSE endpoint not responding correctly"
            exit 1
          fi
      
      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short || true
      
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: debug-logs
          path: |
            uvicorn.log
            metrics.txt
            sse_test.txt
